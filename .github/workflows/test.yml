name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(go run ./tools/build-metadata --version)"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "$version" ]]; then
            printf 'Tag %s does not match source version %s\n' "$REF_NAME" "$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  test:
    needs: metadata
    strategy:
      # Collect every native platform result; one failure must not cancel the
      # remaining compatibility evidence. Release creation still requires all.
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
            msystem: UCRT64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            msystem: UCRT64
          - runner: windows-2022
            os: windows
            arch: amd64
            msystem: UCRT64
            packages: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils
          - runner: windows-11-arm
            os: windows
            arch: arm64
            msystem: CLANGARM64
            packages: mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-llvm-tools mingw-w64-clang-aarch64-lld mingw-w64-clang-aarch64-compiler-rt
    runs-on: ${{ matrix.runner }}
    env:
      GOAMD64: v1
      GOARM64: v8.0
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          architecture: ${{ matrix.arch }}
          cache: false
      - name: Set up Windows build environment
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          install: >-
            make
            diffutils
            patch
            curl
            tar
            xz
            ${{ matrix.packages }}
      - name: Verify native Go architecture
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(go env GOOS)" = "$EXPECTED_OS"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          test "$(go env GOHOSTARCH)" = "$EXPECTED_ARCH"
      - name: Build and verify macOS release
        # Native builds exercise cgo and platform libraries; a pure-Go cross
        # compile would not validate the FFmpeg backend or relinking materials.
        if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh --clean-backend
      - name: Build and verify Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: .\scripts\build-windows.ps1 -Msys2Root $env:MSYS2_ROOT -CleanBackend
      - name: Archive macOS release preserving executable permissions
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          name="hdma2truehd-$RELEASE_VERSION-darwin-$RELEASE_ARCH.tar.gz"
          tar -czf "dist/assets/$name" -C dist "hdma2truehd-darwin-$RELEASE_ARCH"
          (cd dist/assets && shasum -a 256 "$name" > "$name.sha256")
      - name: Archive Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/assets | Out-Null
          $name = "hdma2truehd-$env:RELEASE_VERSION-windows-$env:RELEASE_ARCH.zip"
          Compress-Archive -LiteralPath "dist/hdma2truehd-windows-$env:RELEASE_ARCH" -DestinationPath "dist/assets/$name"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/assets/$name").Hash.ToLowerInvariant()
          "$hash  $name`n" | Set-Content -Encoding ascii -NoNewline "dist/assets/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: hdma2truehd-${{ matrix.os }}-${{ matrix.arch }}
          # Distribute the whole release, not an executable without LGPL inputs.
          path: dist/assets/*
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [metadata, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hdma2truehd-*
          path: assets
          merge-multiple: true
      - name: Verify all four release archives
        working-directory: assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-amd64 windows-amd64 windows-arm64; do
            extension=tar.gz
            if [[ "$target" == windows-* ]]; then extension=zip; fi
            file="hdma2truehd-$RELEASE_VERSION-$target.$extension"
            test -s "$file"
            sha256sum --check "$file.sha256"
          done
          cat ./*.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: docs/RELEASE-NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: assets/*
