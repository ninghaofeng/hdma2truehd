name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Set up Windows build environment
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            make
            diffutils
            patch
            curl
            tar
            xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
      - name: Build and verify macOS release
        # Native builds exercise cgo and platform libraries; a pure-Go cross
        # compile would not validate the FFmpeg backend or relinking materials.
        if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh
      - name: Build and verify Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: .\scripts\build-windows.ps1 -Msys2Root $env:MSYS2_ROOT
      - name: Build and relink macOS desktop UI
        if: runner.os == 'macOS'
        run: |
          bash scripts/build-ui.sh
          bash "dist/hdma2truehd-ui-$(go env GOOS)-$(go env GOARCH)/relink/relink.sh"
          go vet -tags desktop,production ./cmd/hdma2truehd-ui
      - name: Build and relink Windows desktop UI
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: gcc
          CGO_ENABLED: '1'
        run: |
          bash scripts/build-ui.sh
          bash "dist/hdma2truehd-ui-$(go env GOOS)-$(go env GOARCH)/relink/relink.sh"
          go vet -tags desktop,production ./cmd/hdma2truehd-ui
      - uses: actions/upload-artifact@v4
        with:
          name: hdma2truehd-${{ matrix.os }}-with-relink-materials
          # Distribute the whole release, not an executable without LGPL inputs.
          path: dist/
